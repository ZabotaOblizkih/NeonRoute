[pytest]
pythonpath = .
testpaths = tests
norecursedirs = .git .venv venv models cache lancedb __pycache__ PyQt-Fluent-Widgets
markers =
    unit: fast unit tests without Qt/GPU/slow sleeps
    ui: Qt/PyQt6 offscreen UI contract tests
    integration: multi-component integration tests
    smoke: end-to-end and hardware profile smoke tests
    slow: slow tests (>2s) excluded from fast inner-loop runs
